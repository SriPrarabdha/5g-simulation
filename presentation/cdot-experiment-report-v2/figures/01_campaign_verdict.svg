<text x="840.00" y="313.00" font-size="19" fill="#9ab0c8" font-weight="500" text-anchor="start" opacity="1">stress families</text>
<rect x="1182.00" y="205.00" width="330.00" height="144.00" rx="18.00" fill="#0d1b2d" stroke="#243a52" stroke-width="1" opacity="1" filter="url(#shadow)"/>
<text x="1210.00" y="270.00" font-size="43" fill="#ff6b6b" font-weight="800" text-anchor="start" opacity="1">0 / 160</text>
<text x="1210.00" y="313.00" font-size="19" fill="#9ab0c8" font-weight="500" text-anchor="start" opacity="1">passed every gate</text>
<text x="72.00" y="408.00" font-size="16" fill="#9ab0c8" font-weight="700" text-anchor="start" opacity="1" class="smallcaps">GATE SURVIVAL</text>
<text x="72.00" y="458.00" font-size="17" fill="#ecf5ff" font-weight="500" text-anchor="start" opacity="1">Pure surprises exactly Static</text>
