<rect width="1600" height="900" fill="#07111f"/>
<text x="72.00" y="66.00" font-size="17" fill="#24d3c1" font-weight="700" text-anchor="start" opacity="1" class="smallcaps">20,000 PAIRED SIMULATIONS</text>
<text x="72.00" y="119.00" font-size="40" fill="#ecf5ff" font-weight="750" text-anchor="start" opacity="1">A real mechanism win — but no promotable controller</text>
<text x="72.00" y="158.00" font-size="20" fill="#9ab0c8" font-weight="400" text-anchor="start" opacity="1">Every configuration was paired with Static across five stress families and evaluated against 13 frozen gates.</text>
