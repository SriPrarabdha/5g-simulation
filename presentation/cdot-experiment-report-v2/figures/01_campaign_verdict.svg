<text x="470.00" y="313.00" font-size="19" fill="#9ab0c8" font-weight="500" text-anchor="start" opacity="1">paired evaluations</text>
<rect x="812.00" y="205.00" width="330.00" height="144.00" rx="18.00" fill="#0d1b2d" stroke="#243a52" stroke-width="1" opacity="1" filter="url(#shadow)"/>
