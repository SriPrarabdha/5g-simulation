<text x="1530.00" y="769.00" font-size="16" fill="#ff6b6b" font-weight="700" text-anchor="end" opacity="1">56/160</text>
<text x="72.00" y="809.00" font-size="17" fill="#ecf5ff" font-weight="500" text-anchor="start" opacity="1">All overload metrics finite</text>
<rect x="590.00" y="790.00" width="922.00" height="18.00" rx="9.00" fill="#10243a" stroke="none" stroke-width="1" opacity="1"/>
<rect x="590.00" y="790.00" width="0.00" height="18.00" rx="9.00" fill="#ff6b6b" stroke="none" stroke-width="1" opacity="1"/>
