<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>Two-minute versus ten-minute controller cadence</title>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".32"/></filter>
<linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24d3c1"/><stop offset="1" stop-color="#5aa9ff"/></linearGradient>
<linearGradient id="amberCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbd59"/><stop offset="1" stop-color="#ff6b6b"/></linearGradient>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.smallcaps{letter-spacing:2.4px;font-weight:700}</style>
</defs>
<rect width="1600" height="900" fill="#07111f"/>
<text x="72.00" y="66.00" font-size="17" fill="#24d3c1" font-weight="700" text-anchor="start" opacity="1" class="smallcaps">MATCHED CADENCE EXPERIMENT</text>
<text x="72.00" y="119.00" font-size="40" fill="#ecf5ff" font-weight="750" text-anchor="start" opacity="1">2-minute pre-drain is statistically neutral — and 3.6× more churn-heavy</text>
<text x="72.00" y="158.00" font-size="20" fill="#9ab0c8" font-weight="400" text-anchor="start" opacity="1">The observation window stays fixed at 10 minutes; each comparison matches blend, horizon, reserve and surprise envelope.</text>
<rect x="72.00" y="225.00" width="700.00" height="200.00" rx="18.00" fill="#0d1b2d" stroke="#243a52" stroke-width="1" opacity="1" filter="url(#shadow)"/>
<text x="100.00" y="264.00" font-size="18" fill="#9ab0c8" font-weight="650" text-anchor="start" opacity="1">Mean UL gain</text>
<text x="100.00" y="329.00" font-size="39" fill="#24d3c1" font-weight="800" text-anchor="start" opacity="1">6.65%</text>
<text x="427.00" y="329.00" font-size="39" fill="#5aa9ff" font-weight="800" text-anchor="start" opacity="1">6.74%</text>
<text x="100.00" y="368.00" font-size="15" fill="#24d3c1" font-weight="650" text-anchor="start" opacity="1">10-minute</text>
<text x="427.00" y="368.00" font-size="15" fill="#5aa9ff" font-weight="650" text-anchor="start" opacity="1">2-minute</text>
<text x="737.00" y="398.00" font-size="16" fill="#4ade80" font-weight="700" text-anchor="end" opacity="1">Δ +0.084%</text>
<rect x="812.00" y="225.00" width="700.00" height="200.00" rx="18.00" fill="#0d1b2d" stroke="#243a52" stroke-width="1" opacity="1" filter="url(#shadow)"/>
<text x="840.00" y="264.00" font-size="18" fill="#9ab0c8" font-weight="650" text-anchor="start" opacity="1">95% lower bound</text>
<text x="840.00" y="329.00" font-size="39" fill="#24d3c1" font-weight="800" text-anchor="start" opacity="1">3.13%</text>
<text x="1167.00" y="329.00" font-size="39" fill="#5aa9ff" font-weight="800" text-anchor="start" opacity="1">3.21%</text>
<text x="840.00" y="368.00" font-size="15" fill="#24d3c1" font-weight="650" text-anchor="start" opacity="1">10-minute</text>
<text x="1167.00" y="368.00" font-size="15" fill="#5aa9ff" font-weight="650" text-anchor="start" opacity="1">2-minute</text>
<text x="1477.00" y="398.00" font-size="16" fill="#4ade80" font-weight="700" text-anchor="end" opacity="1">Δ +0.078%</text>
<rect x="72.00" y="465.00" width="700.00" height="200.00" rx="18.00" fill="#0d1b2d" stroke="#243a52" stroke-width="1" opacity="1" filter="url(#shadow)"/>
<text x="100.00" y="504.00" font-size="18" fill="#9ab0c8" font-weight="650" text-anchor="start" opacity="1">Churn / group-hour</text>
<text x="100.00" y="569.00" font-size="39" fill="#24d3c1" font-weight="800" text-anchor="start" opacity="1">0.031</text>
<text x="427.00" y="569.00" font-size="39" fill="#5aa9ff" font-weight="800" text-anchor="start" opacity="1">0.112</text>
<text x="100.00" y="608.00" font-size="15" fill="#24d3c1" font-weight="650" text-anchor="start" opacity="1">10-minute</text>
<text x="427.00" y="608.00" font-size="15" fill="#5aa9ff" font-weight="650" text-anchor="start" opacity="1">2-minute</text>
<text x="737.00" y="638.00" font-size="16" fill="#ff6b6b" font-weight="700" text-anchor="end" opacity="1">3.59× higher at 2 minutes</text>
<rect x="812.00" y="465.00" width="700.00" height="200.00" rx="18.00" fill="#0d1b2d" stroke="#243a52" stroke-width="1" opacity="1" filter="url(#shadow)"/>
<text x="840.00" y="504.00" font-size="18" fill="#9ab0c8" font-weight="650" text-anchor="start" opacity="1">≤500 ms decisions</text>
<text x="840.00" y="569.00" font-size="39" fill="#24d3c1" font-weight="800" text-anchor="start" opacity="1">99.82%</text>
<text x="1167.00" y="569.00" font-size="39" fill="#5aa9ff" font-weight="800" text-anchor="start" opacity="1">99.98%</text>
<text x="840.00" y="608.00" font-size="15" fill="#24d3c1" font-weight="650" text-anchor="start" opacity="1">10-minute</text>
<text x="1167.00" y="608.00" font-size="15" fill="#5aa9ff" font-weight="650" text-anchor="start" opacity="1">2-minute</text>
<text x="1477.00" y="638.00" font-size="16" fill="#9ab0c8" font-weight="700" text-anchor="end" opacity="1">Δ +0.159%</text>
<rect x="72.00" y="725.00" width="700.00" height="105.00" rx="16.00" fill="#10243a" stroke="none" stroke-width="1" opacity="1"/>
<text x="98.00" y="761.00" font-size="16" fill="#9ab0c8" font-weight="650" text-anchor="start" opacity="1">Pre-drain matched profiles</text>
<text x="98.00" y="803.00" font-size="31" fill="#ecf5ff" font-weight="800" text-anchor="start" opacity="1">43 / 64</text>
<text x="290.00" y="803.00" font-size="17" fill="#9ab0c8" font-weight="500" text-anchor="start" opacity="1">had higher mean gain at 2 min</text>
<rect x="812.00" y="725.00" width="700.00" height="105.00" rx="16.00" fill="#10243a" stroke="none" stroke-width="1" opacity="1"/>
<text x="838.00" y="761.00" font-size="16" fill="#9ab0c8" font-weight="650" text-anchor="start" opacity="1">MPC matched profiles</text>
<text x="838.00" y="803.00" font-size="31" fill="#ff6b6b" font-weight="800" text-anchor="start" opacity="1">2.90% → 0.00%</text>
<text x="1118.00" y="803.00" font-size="17" fill="#9ab0c8" font-weight="500" text-anchor="start" opacity="1">(16 profiles; event solves timed out)</text>
</svg>
