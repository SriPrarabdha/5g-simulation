[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdot-upf-simulation"
version = "0.1.0"
description = "Deterministic macro simulation for predictive 5G UPF steering"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cdot-sim = "simulator.macro.cli:main"

[tool.setuptools.packages.find]
include = ["schemas*", "simulator*", "steering*"]

