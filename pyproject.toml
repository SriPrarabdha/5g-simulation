[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdot-upf-simulation"
version = "0.1.0"
description = "Deterministic macro simulation for predictive 5G UPF steering"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=14",
  "lightgbm>=4",
  "duckdb>=1.1",
  "httpx>=0.28",
]

[project.optional-dependencies]
workshop = [
  "jupyterlab>=4.2",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "qrcode>=8.0",
]

[project.scripts]
cdot-sim = "simulator.macro.cli:main"

[tool.setuptools.packages.find]
include = ["schemas*", "simulator*", "steering*", "telemetry*", "forecasting*", "optimization*", "demo_api*", "workshop*"]
